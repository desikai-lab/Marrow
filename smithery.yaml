# Smithery configuration for Marrow MCP server
# https://smithery.ai/docs/config

startCommand:
  type: http
  configSchema:
    type: object
    required:
      - secretToken
      - tasksDir
    properties:
      secretToken:
        type: string
        description: "Authentication token for MCP and REST API requests (set SECRET_TOKEN env var)"
      tasksDir:
        type: string
        description: "Absolute path to the directory where Marrow project workspaces are stored (set TASKS_DIR env var)"
      embeddingModelCode:
        type: string
        default: "BAAI/bge-small-en-v1.5"
        description: "Sentence-transformer model for code skeleton embeddings (EMBEDDING_MODEL_CODE)"
      embeddingModelText:
        type: string
        default: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
        description: "Sentence-transformer model for text/artifact embeddings (EMBEDDING_MODEL_TEXT)"
      embeddingDimensions:
        type: integer
        default: 384
        description: "Embedding vector dimensions — must match the chosen model (EMBEDDING_DIMENSIONS)"
      port:
        type: integer
        default: 8000
        description: "HTTP port for the MCP server"
  exampleConfig:
    secretToken: "your-strong-random-secret"
    tasksDir: "/home/user/marrow-projects"
