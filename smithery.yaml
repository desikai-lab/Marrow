# Smithery configuration for Marrow MCP server
# https://smithery.ai/docs/config

startCommand:
  type: http
  configSchema:
    type: object
    required:
      - SECRET_TOKEN
      - TASKS_DIR
    properties:
      SECRET_TOKEN:
        type: string
        description: "Bearer token for MCP and REST API authentication (must match server SECRET_TOKEN)"
      TASKS_DIR:
        type: string
        description: "Absolute path where Marrow project workspaces are stored"
      EMBEDDING_MODEL_CODE:
        type: string
        default: "BAAI/bge-small-en-v1.5"
        description: "Sentence-transformer model for code skeleton embeddings"
      EMBEDDING_MODEL_TEXT:
        type: string
        default: "sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2"
        description: "Sentence-transformer model for text/artifact embeddings"
      EMBEDDING_DIMENSIONS:
        type: string
        default: "384"
        description: "Embedding vector dimensions — must match the chosen model"
      PORT:
        type: string
        default: "8000"
        description: "HTTP port for the MCP server"
  exampleConfig:
    SECRET_TOKEN: "your-strong-random-secret"
    TASKS_DIR: "/home/user/marrow-projects"
