[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "marrow-worker"
version = "1.1.0"
description = "Persistent MCP intelligence backend for AI coding agents — file watcher and skeleton indexer"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "ai", "agents", "tree-sitter", "code-indexer", "embeddings"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "marrow-common>=1.1.0",
    "watchdog>=4.0",
    "httpx>=0.27",
    "tree-sitter>=0.23",
    "tree-sitter-python>=0.23",
    "tree-sitter-typescript>=0.23",
    "tree-sitter-c-sharp>=0.23",
    "sentence-transformers>=3.0",
    "torch>=2.2",
    "pydantic>=2.7",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
]

[project.scripts]
marrow-worker = "main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
