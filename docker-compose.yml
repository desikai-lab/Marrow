services:

  marrow-init:
    image: ghcr.io/desikai-lab/marrow-server:latest
    container_name: marrow-init
    volumes:
      - marrow-data:/data
    environment:
      SECRET_TOKEN: ${SECRET_TOKEN}
      TASKS_DIR: /data
      DEFAULT_PROJECT: ${DEFAULT_PROJECT:-default}
    command: >
      sh -c "
        PROJECTS_DIR=$${TASKS_DIR}/projects
        DEFAULT=$${DEFAULT_PROJECT:-default}
        if [ ! -d $$PROJECTS_DIR ] || [ -z $$(ls -A $$PROJECTS_DIR 2>/dev/null) ]; then
          echo '[Marrow] First run: initializing project '$$DEFAULT'...'
          marrow-admin project-init --project $$DEFAULT
        else
          echo '[Marrow] Projects found. Skipping init.'
        fi
      "
    restart: "no"

  marrow-server:
    image: ghcr.io/desikai-lab/marrow-server:latest
    container_name: marrow-server
    ports:
      - "8000:8000"
    volumes:
      - marrow-data:/data
      - marrow-projects:/projects:ro
      - marrow-hf-cache:/root/.cache/huggingface
    environment:
      SECRET_TOKEN: ${SECRET_TOKEN}
      TASKS_DIR: /data
      DEFAULT_PROJECT: ${DEFAULT_PROJECT:-default}

      EMBEDDING_MODEL_CODE: ${EMBEDDING_MODEL_CODE:-BAAI/bge-small-en-v1.5}
      EMBEDDING_MODEL_TEXT: ${EMBEDDING_MODEL_TEXT:-sentence-transformers/paraphrase-multilingual-MiniLM-L12-v2}
      EMBEDDING_DIMENSIONS: ${EMBEDDING_DIMENSIONS:-384}
      VECT_DEBOUNCE_SECONDS: ${VECT_DEBOUNCE_SECONDS:-0.5}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
    depends_on:
      marrow-init:
        condition: service_completed_successfully
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import httpx; httpx.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  marrow-worker:
    image: ghcr.io/desikai-lab/marrow-worker:latest
    container_name: marrow-worker
    volumes:
      # Same volume as the server — paths inside the container must be identical
      # so that SOURCE_ROOT in .settings resolves correctly for both services.
      - marrow-projects:/projects:ro
      - marrow-hf-cache:/root/.cache/huggingface
    environment:
      SECRET_TOKEN: ${SECRET_TOKEN}
      EMBEDDING_MODEL_CODE: ${EMBEDDING_MODEL_CODE:-BAAI/bge-small-en-v1.5}
      HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
      POLLING_INTERVAL: ${POLLING_INTERVAL:-1.0}
    command: >
      python main.py
        --repo-dir /projects/${PROJECT_1_PATH}
        --project-name ${PROJECT_1_NAME:-${DEFAULT_PROJECT:-default}}
        --target-url http://marrow-server:8000
        --secret-token ${SECRET_TOKEN}
        --extensions ${EXTENSIONS:-.cs,.ts,.py}
        --init
    # remove --init after first successful run
    depends_on:
      marrow-server:
        condition: service_healthy
    restart: unless-stopped    

  # ---------------------------------------------------------------------------
  # Additional worker template — one worker per project.
  # Uncomment and duplicate this block for each extra project.
  # Add PROJECT_2_NAME and PROJECT_2_PATH to your .env file.
  # ---------------------------------------------------------------------------
  # marrow-worker-2:
  #   image: ghcr.io/desikai-lab/marrow-worker:latest
  #   container_name: marrow-worker-2
  #   volumes:
  #     - marrow-projects:/projects:ro
  #     - marrow-hf-cache:/root/.cache/huggingface
  #   environment:
  #     SECRET_TOKEN: ${SECRET_TOKEN} 
  #     EMBEDDING_MODEL_CODE: ${EMBEDDING_MODEL_CODE:-BAAI/bge-small-en-v1.5}
  #     HF_HUB_OFFLINE: ${HF_HUB_OFFLINE:-0}
  #   command: >
  #     python main.py
  #       --repo-dir /projects/${PROJECT_2_PATH}
  #       --project-name ${PROJECT_2_NAME}
  #       --target-url http://marrow-server:8000
  #       --secret-token ${SECRET_TOKEN}
  #       --extensions ${EXTENSIONS:-.cs,.ts,.py}
  #       --init
  #     # remove --init after first successful run
  #   depends_on:
  #     marrow-server:
  #       condition: service_healthy
  #   restart: unless-stopped

volumes:
  marrow-data:
  marrow-projects:
  marrow-hf-cache:
