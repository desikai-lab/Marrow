[build-system]
requires = ["setuptools>=70.0.0", "wheel>=0.46.2"]
build-backend = "setuptools.build_meta"


[project]
name = "marrow-server"
version = "1.1.0"
description = "Persistent MCP intelligence backend for AI coding agents — server component"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["mcp", "ai", "agents", "lancedb", "fastapi", "context"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]

dependencies = [
    "marrow-common>=1.0.0",
    "fastapi==0.141.1",
    "uvicorn[standard]==0.54.0",
    "mcp[cli]==1.30.0,<2.0",
    "lancedb[pylance]==0.39.0",
    "pyarrow==25.0.1",
    "pydantic==2.13.5",
    "python-dotenv==1.2.3",
    "pyyaml==6.0.3",
    "aiofiles==25.1.0",
    "fastembed==0.8.1",
    "packaging==26.3",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
marrow-server = "marrow_server:main"
marrow-admin = "cli.admin_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["project-template/**/*", "project-template/**/.*"]

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
markers = [
    "integration: marks tests as integration tests",
]
