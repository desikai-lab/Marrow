name: Build B4000282 Trixie Comparison Images

# workflow_dispatch ONLY. One-off, human-triggered comparison build for
# B4000282 -- must never run on push/PR, and must never be merged into
# docker-publish.yml (TD4000280 owns that file; ADR-0035 one-task-one-branch).
on:
  workflow_dispatch:
    inputs:
      pinned_commit:
        description: 'Commit SHA the LOCAL python:3.12-slim comparison image is pinned to (architecture.md §2)'
        required: true
        default: '4dc53d3335f99504cf9652fbf768273f60ed2f12'

env:
  REGISTRY: ghcr.io

jobs:
  build-trixie-experimental:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase repository name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-server-trixie-slim" >> $GITHUB_ENV

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Trixie-Experimental Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./marrow_server/Dockerfile.trixie-experimental
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:experimental
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:experimental-${{ github.event.inputs.pinned_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  build-local-pinned-comparison:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout repository at the pinned commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.pinned_commit }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Downcase repository name
        run: echo "IMAGE_NAME=${GITHUB_REPOSITORY,,}-server-python3.12-slim-pinned" >> $GITHUB_ENV

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Pinned Local-Comparison Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./marrow_server/Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.event.inputs.pinned_commit }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
