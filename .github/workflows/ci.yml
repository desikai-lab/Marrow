name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-and-test:
    name: Lint & Test
    runs-on: ubuntu-latest

    strategy:
      matrix:
        python-version: ["3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -e marrow_common/
          pip install -e "marrow_server/[dev]"
          pip install -e "marrow_worker/[dev]"

      - name: Lint with ruff
        run: |
          ruff check marrow_server/src marrow_worker/src marrow_common/
          ruff format --check marrow_server/src marrow_worker/src marrow_common/

      - name: Run unit tests — marrow_server
        working-directory: marrow_server
        env:
          PYTHONPATH: src:..
          SECRET_TOKEN: ci-dummy-token
        run: python -m pytest tests/unit/ -v --tb=short

      - name: Run unit tests — marrow_worker
        working-directory: marrow_worker
        env:
          PYTHONPATH: src:..
        run: python -m pytest tests/ -v --tb=short
