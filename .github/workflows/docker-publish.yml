name: Build and Publish Docker Image

on:
  workflow_dispatch:
    inputs:
      component:
        description: 'Which component to build?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - server
          - worker
      image_tag:
        description: 'Docker image tag (e.g., v1.0.0 or latest)'
        required: true
        default: 'latest'
        type: string

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # -------------------------------------------------------------
  #  Server
  # -------------------------------------------------------------
  build-server:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'server' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Server Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./marrow_server/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-server:${{ github.event.inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # -------------------------------------------------------------
  # Worker
  # -------------------------------------------------------------
  build-worker:
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.component == 'all' || github.event.inputs.component == 'worker' }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log into registry ${{ env.REGISTRY }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Worker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./marrow_worker/Dockerfile
          push: true
          tags: ${{ env.REGISTRY }}/${{ github.repository }}-worker:${{ github.event.inputs.image_tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max